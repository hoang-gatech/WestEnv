<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiteDesk</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div id="app">
    <div id="map" role="application" aria-label="Map of Vietnam. Click a point to get a site profile."></div>

    <details id="layers" class="card" open>
      <summary><h2>Map layers</h2></summary>
      <fieldset>
        <legend>Base map</legend>
        <label><input type="radio" name="base" value="map" checked> Map</label>
        <label><input type="radio" name="base" value="terrain"> Terrain (3D relief)</label>
      </fieldset>
      <fieldset>
        <legend>Overlays</legend>
        <label><input type="checkbox" id="ov-soil"> Soil type (WRB)</label>
        <label><input type="checkbox" id="ov-weather"> Current weather</label>
        <label><input type="checkbox" id="ov-hotspots" checked> Dioxin hotspots</label>
      </fieldset>
      <img id="soil-legend" hidden alt="Legend: WRB most probable soil group">
      <p id="layers-note" class="small error" hidden></p>
    </details>

    <details id="panel" class="card" open>
      <summary><h2>Site profile</h2></summary>
      <div id="panel-content" aria-live="polite">
        <div id="panel-empty">
          <p>Click anywhere in Vietnam to get its coordinates, weather, soil, terrain and distance to known dioxin hotspots.</p>
          <p class="muted">Screening-level context from public datasets and models. Not a survey or laboratory result.</p>
        </div>
        <div id="panel-body" hidden></div>
      </div>
    </details>

    <details id="chat" class="card">
      <summary><h2>Ask</h2></summary>
      <div id="chat-body">
        <div id="chat-log" role="log" aria-live="polite" aria-label="Conversation"></div>
        <div id="chat-context" hidden>
          <span id="chat-context-text"></span>
          <button type="button" id="chat-context-clear" aria-label="Do not use the selected point" title="Do not use the selected point">&times;</button>
        </div>
        <form id="chat-form">
          <textarea id="chat-input" rows="2" maxlength="4000" aria-label="Your question" placeholder="Ask about a site (Enter to send)"></textarea>
          <button type="submit" id="chat-send">Send</button>
        </form>
        <div id="chat-settings">
          <select id="chat-endpoint" aria-label="Provider"></select>
          <select id="chat-model" aria-label="Model"></select>
          <button type="button" id="chat-clear" class="link">Clear</button>
        </div>
      </div>
    </details>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js?v=5"></script>
  <script src="chat.js?v=5"></script>
</body>
</html>
