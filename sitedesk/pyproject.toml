[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitedesk"
version = "0.1.0"
description = "Contaminated-site screening assistant for Vietnam: GIS data tools served over MCP, plus a map front end."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6",
]

[project.optional-dependencies]
# One official SDK per vendor; the chat assistant imports only the ones sitedesk.yaml uses.
chat = ["anthropic>=2,<3", "google-genai>=2,<3", "openai>=3,<4"]
dev = ["sitedesk[chat]", "pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.6"]

[project.scripts]
sitedesk-mcp = "sitedesk.mcp_server:main"
sitedesk-api = "sitedesk.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sitedesk = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls the real upstream APIs (run with `pytest -m live`)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
